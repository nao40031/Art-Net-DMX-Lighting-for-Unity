name: Sync release UPM package

on:
  push:
    branches:
      - upm/release

permissions:
  contents: write

concurrency:
  group: sync-release-upm-lock
  cancel-in-progress: false

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Sync Art-Net package from UPM release
        env:
          UPM_COMMIT: ${{ github.sha }}
        run: |
          git checkout "$UPM_COMMIT" -- Packages/jp.oshino.art-net-dmx-lighting-for-unity
          git checkout HEAD -- Packages/jp.oshino.art-net-dmx-lighting-for-unity/README.md

      - name: Commit and push package update
        run: |
          if git diff --cached --quiet -- Packages/jp.oshino.art-net-dmx-lighting-for-unity; then
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Packages/jp.oshino.art-net-dmx-lighting-for-unity
          git commit -m 'Sync release package with UPM'
          git push origin HEAD:release
