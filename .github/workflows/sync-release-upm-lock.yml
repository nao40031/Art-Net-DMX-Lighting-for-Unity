name: Sync release UPM lock

on:
  push:
    branches:
      - upm/release

permissions:
  contents: write

concurrency:
  group: sync-release-upm-lock
  cancel-in-progress: false

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Update locked Art-Net package revision
        env:
          UPM_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const path = 'Packages/packages-lock.json';
          const packageKey = '"jp.oshino.art-net-dmx-lighting-for-unity": {';
          const content = fs.readFileSync(path, 'utf8');
          const packageStart = content.indexOf(packageKey);
          const packageEnd = content.indexOf('\n    },', packageStart);

          if (packageStart < 0 || packageEnd < 0) {
            throw new Error('Art-Net package lock entry was not found.');
          }

          const entry = content.slice(packageStart, packageEnd);
          const updatedEntry = entry.replace(/("hash": ")[^"]+(")/, `$1${process.env.UPM_COMMIT}$2`);
          if (updatedEntry === entry) {
            throw new Error('Art-Net package lock hash was not found.');
          }

          fs.writeFileSync(path, content.slice(0, packageStart) + updatedEntry + content.slice(packageEnd));
          NODE

      - name: Commit and push lock update
        run: |
          if git diff --quiet -- Packages/packages-lock.json; then
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Packages/packages-lock.json
          git commit -m 'Sync release lock with UPM package'
          git push origin HEAD:release
